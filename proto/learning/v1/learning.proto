syntax = "proto3";

package learning.v1;

option go_package = "github.com/aomerge/higpertext-server-profile/gen/learning/v1;learningv1";

import "google/protobuf/timestamp.proto";

message LearningText {
  string id = 1;
  string learning_event_id = 2;
  string thought_id = 3;
  int32 seq = 4;
  string text_kind = 5;
  string source = 6;
  string action_id = 7;
  string tool_name = 8;
  string outcome = 9;
  int64 tokens = 10;
  string content = 11;
  string output_text = 12;
  string profile = 13;
  string project_id = 14;
  string user_id = 15;
  google.protobuf.Timestamp created_at = 16;
}

message RecordLearningTextRequest { LearningText text = 1; }
message RecordLearningTextResponse { LearningText text = 1; }

message ListLearningTextsRequest {
  string learning_event_id = 1;
  string profile = 2;
  string project_id = 3;
  string text_kind = 4;
  int32 limit = 5;
}
message ListLearningTextsResponse { repeated LearningText texts = 1; }

message LearningClassification {
  string id = 1;
  string learning_text_id = 2;
  string scenario = 3;
  repeated string labels = 4;
  double confidence = 5;
  string classifier = 6;
  string model_version = 7;
  google.protobuf.Timestamp created_at = 8;
}

message ClassifyLearningTextRequest {
  string learning_text_id = 1;
  string text = 2;
  string source = 3;
  string tool_name = 4;
}
message ClassifyLearningTextResponse { LearningClassification classification = 1; }

message ListClassificationsRequest {
  string learning_text_id = 1;
  string scenario = 2;
  int32 limit = 3;
}
message ListClassificationsResponse { repeated LearningClassification classifications = 1; }

service LearningService {
  rpc RecordText(RecordLearningTextRequest) returns (RecordLearningTextResponse);
  rpc ListTexts(ListLearningTextsRequest) returns (ListLearningTextsResponse);
  rpc ClassifyText(ClassifyLearningTextRequest) returns (ClassifyLearningTextResponse);
  rpc ListClassifications(ListClassificationsRequest) returns (ListClassificationsResponse);
}
