syntax = "proto3";

package board.v1;

option go_package = "github.com/aomerge/higpertext-server-profile/gen/board/v1;boardv1";

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";

// BoardService y hermanos (ColumnService, ActivityService, TaskService, más
// abajo) son un dominio deliberadamente aislado: viven en su propia base
// (board.db, ver internal/storage/sqlite/board_db.go) y en su propio
// paquete proto (board.v1, sin depender de profile.v1), para que el día de
// mañana puedan extraerse como microservicio propio sin arrastrar el resto
// del catálogo de perfiles/capabilities/gobernanza.
//
// Jerarquía: Board -> Column -> WorkItem (BoardActivity por compatibilidad)
// -> Task -> AcceptanceCriterion. Un WorkItem puede ser roadmap, feature,
// story, bug o issue; todos comparten el mismo flujo kanban.
// BoardActivity es la "tarjeta" compatible que se mueve entre columnas
// (equivalente agile de un WorkItem); Task es un ítem de checklist
// dentro de un WorkItem (no tiene columna propia); AcceptanceCriterion
// es un renglón de ese checklist, gestionado siempre inline con su Task.
//
// A diferencia de otros dominios de este server (ej. GovernanceService
// agrupa Rule+Exception en un solo service), acá cada entidad de la
// jerarquía tiene su PROPIO service gRPC — BoardService, ColumnService,
// ActivityService, TaskService — para que se vean como entradas separadas
// en cualquier explorador de RPCs (grpcurl/grpcui), igual que
// profile.v1.ProfileService/CapabilityService/SkillService. Del lado Go,
// cada service tiene su propio server (BoardServer, ColumnServer,
// BoardActivityServer, TaskServer en internal/service/), todos compartiendo
// la misma domain.BoardRepository — no hay motivo para 4 conexiones a
// board.db.
//
// Verificación (VerificationService, más abajo): una Task con
// AcceptanceCriterion solo puede quedar done cuando el server aprobó una
// corrida rojo→verde de sus escenarios ejecutables. UpdateTask(done=true)
// y MoveActivity a la columna Done se rechazan (FAILED_PRECONDITION) si
// alguna Task con criterios no está VERIFICATION_VERIFIED.
//
// Fuera de alcance en esta iteración (PoC, deuda técnica aceptada a
// propósito): no hay correlación automática con
// profile.v1.Activity / profile.v1.LearningEvent y no hay autenticación.

// ── Priority ─────────────────────────────────────────────────────────────
//
// Compartido por BoardActivity. Enum propio de board.v1 (no reutiliza
// profile.v1.Severity) para no acoplar este paquete a profile.proto.
enum Priority {
  PRIORITY_UNSPECIFIED = 0;
  LOW = 1;
  MEDIUM = 2;
  HIGH = 3;
  CRITICAL = 4;
}

enum WorkItemType {
  WORK_ITEM_TYPE_UNSPECIFIED = 0;
  ROADMAP = 1;
  EPIC = 2;
  FEATURE = 3;
  STORY = 4;
  BUG = 5;
  ISSUE = 6;
}

// ── Board ────────────────────────────────────────────────────────────────

message Board {
  string id = 1;
  string name = 2;
  string description = 3;
  string project_id = 4; // referencia blanda a profile.v1.Project (tenancy.db), opcional
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
}

message CreateBoardRequest {
  string name = 1;
  string description = 2;
  string project_id = 3;
}
message CreateBoardResponse { Board board = 1; }
message GetBoardRequest { string id = 1; }
message GetBoardResponse { Board board = 1; }
message ListBoardsRequest {
  string project_id = 1; // vacío = todos los boards, de cualquier proyecto
}
message ListBoardsResponse { repeated Board boards = 1; }
message DeleteBoardRequest { string id = 1; } // borra en cascada Column/BoardActivity/Task/AcceptanceCriterion

// ResolveBoard hace upsert idempotente por (project_id, name) — mismo
// patrón que profile.v1.ProjectService.ResolveProject /
// profile.v1.UserService.ResolveUser. Si el board no existía, además crea
// sus 3 columnas fijas (Pending, Active, Done — ver domain.BoardColumn*),
// listas para usar.
message ResolveBoardRequest {
  string project_id = 1;
  string name = 2;
}
message ResolveBoardResponse { Board board = 1; }

// ── Column ───────────────────────────────────────────────────────────────

message Column {
  string id = 1;
  string board_id = 2;
  string name = 3;
  int32 position = 4; // orden dentro del board, 0-based
  google.protobuf.Timestamp created_at = 5;
}

message CreateColumnRequest {
  string board_id = 1;
  string name = 2;
  int32 position = 3;
}
message CreateColumnResponse { Column column = 1; }
message ListColumnsRequest { string board_id = 1; }
message ListColumnsResponse { repeated Column columns = 1; } // ordenadas por position asc
message DeleteColumnRequest { string id = 1; } // borra en cascada BoardActivity/Task/AcceptanceCriterion de esa columna

message ColumnPosition {
  string id = 1;
  int32 position = 2;
}
message ReorderColumnsRequest {
  string board_id = 1;
  repeated ColumnPosition columns = 2; // set completo de posiciones deseado
}
message ReorderColumnsResponse { repeated Column columns = 1; }

// ── BoardActivity ────────────────────────────────────────────────────────
//
// El service se llama ActivityService (no BoardActivityService) porque
// vive en el paquete board.v1 — no hay colisión posible con
// profile.v1.ActivityService al ser paquetes proto distintos. Del lado Go
// sí se usa el nombre BoardActivityServer para el struct que lo implementa,
// para no chocar con el ActivityServer de profile.v1 dentro del mismo
// paquete Go internal/service.

message BoardActivity {
  string id = 1;
  string board_id = 2;
  string column_id = 3;
  string title = 4;
  string description = 5;
  string assignee_user_id = 6; // referencia blanda a profile.v1.User (tenancy.db), opcional
  Priority priority = 7;
  repeated string tags = 8;
  int32 position = 9; // orden dentro de la columna, 0-based
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
  optional google.protobuf.Timestamp closed_at = 12;
  WorkItemType type = 13;
  string parent_id = 14; // WorkItem padre opcional para jerarquías agile
}

message CreateActivityRequest {
  string board_id = 1;
  string column_id = 2; // vacío = primera columna del board
  string title = 3;
  string description = 4;
  string assignee_user_id = 5;
  Priority priority = 6;
  repeated string tags = 7;
  WorkItemType type = 8; // omitido = ROADMAP por compatibilidad
  string parent_id = 9;
}
message CreateActivityResponse { BoardActivity activity = 1; }
message GetActivityRequest { string id = 1; }
message GetActivityResponse { BoardActivity activity = 1; }
message ListActivitiesRequest {
  string board_id = 1;
  string column_id = 2; // vacío = todas las columnas del board
}
message ListActivitiesResponse { repeated BoardActivity activities = 1; } // ordenadas por column_id, position asc
message UpdateActivityRequest {
  string id = 1;
  string title = 2;
  string description = 3;
  string assignee_user_id = 4;
  Priority priority = 5;
  repeated string tags = 6;
}
message UpdateActivityResponse { BoardActivity activity = 1; }
message DeleteActivityRequest { string id = 1; } // borra en cascada Task/AcceptanceCriterion de esa activity

message MoveActivityRequest {
  string id = 1;
  string target_column_id = 2;
  int32 position = 3; // posición deseada dentro de target_column_id
}
message MoveActivityResponse { BoardActivity activity = 1; }

// ── Task ─────────────────────────────────────────────────────────────────
//
// AcceptanceCriterion se gestiona siempre inline con su Task — no hay RPCs
// propios para crearlo/borrarlo suelto.

message Task {
  string id = 1;
  string board_activity_id = 2;
  string title = 3;
  bool done = 4;
  int32 position = 5; // orden dentro de la BoardActivity, 0-based
  repeated AcceptanceCriterion acceptance_criteria = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
  TaskVerification verification = 9;
}

message AcceptanceCriterion {
  string id = 1;
  string task_id = 2;
  string description = 3;
  bool done = 4; // lo marca el server al aprobar la verificación de la Task
  google.protobuf.Timestamp created_at = 5;
  repeated VerificationScenario scenarios = 6;
}

// AcceptanceCriterionInput es el shape mínimo para crear un criterio inline
// al crear una Task — sin id/task_id/done (el server los asigna: id nuevo,
// done=false por default).
message AcceptanceCriterionInput {
  string description = 1;
}

message CreateTaskRequest {
  string board_activity_id = 1;
  string title = 2;
  repeated AcceptanceCriterionInput acceptance_criteria = 3;
}
message CreateTaskResponse { Task task = 1; }
message GetTaskRequest { string id = 1; }
message GetTaskResponse { Task task = 1; }
message ListTasksRequest { string board_activity_id = 1; }
message ListTasksResponse { repeated Task tasks = 1; } // ordenadas por position asc
message UpdateTaskRequest {
  string id = 1;
  string title = 2;
  bool done = 3; // true exige verification.state == VERIFICATION_VERIFIED si la task tiene criterios
  int32 position = 4;
}
message UpdateTaskResponse { Task task = 1; }
message DeleteTaskRequest { string id = 1; } // borra en cascada sus AcceptanceCriterion

// ── Verification ─────────────────────────────────────────────────────────
//
// Ciclo: ProposeScenarios (agente verificador, reemplaza la spec completa)
// -> FreezeSpec (fija spec_hash + base_commit + implementer) -> el
// implementador trabaja -> htx-verify corre cada escenario en base_commit y
// en el árbol nuevo -> RecordVerification. El server re-evalúa los asserts
// sobre la salida reportada y exige rojo->verde: un escenario que PASA en
// base_commit no discrimina y rechaza la corrida.
//
// Anti-sesgo (ProposeScenarios devuelve INVALID_ARGUMENT con todas las
// violaciones): cada criterio necesita >=1 escenario SCENARIO_HAPPY y >=1
// NEGATIVE/BOUNDARY/ERROR; cada escenario necesita un assert sobre la
// salida (no solo exit code); se rechazan comandos triviales (true, echo),
// comandos que enmascaran fallos (|| true, set +e), asserts auto-cumplidos,
// regex que matchean la salida vacía y escenarios duplicados. El
// implementer de FreezeSpec no puede ser autor de ningún escenario.

enum ScenarioKind {
  SCENARIO_KIND_UNSPECIFIED = 0;
  SCENARIO_HAPPY = 1;
  SCENARIO_NEGATIVE = 2;
  SCENARIO_BOUNDARY = 3;
  SCENARIO_ERROR = 4;
}

enum VerificationState {
  VERIFICATION_STATE_UNSPECIFIED = 0; // sin escenarios
  VERIFICATION_DRAFT = 1;
  VERIFICATION_FROZEN = 2;
  VERIFICATION_VERIFIED = 3;
  VERIFICATION_FAILED = 4; // última corrida rechazada; se puede reintentar
}

enum VerificationPhase {
  VERIFICATION_PHASE_UNSPECIFIED = 0;
  PHASE_BASE = 1; // base_commit, sin el cambio: debe fallar
  PHASE_HEAD = 2; // árbol nuevo, con el cambio: debe pasar
}

// VerificationStep: "output" es stdout+stderr combinados.
// expect_exit_code = 0 es un valor explícito válido.
message VerificationStep {
  string name = 1;
  string command = 2;
  int32 expect_exit_code = 3;
  repeated string output_contains = 4;
  repeated string output_not_contains = 5;
  string output_regex = 6;
  int32 timeout_seconds = 7; // 0 = default del runner (120s), máx 600
}

message VerificationScenario {
  string id = 1;
  string task_id = 2;
  string criterion_id = 3;
  ScenarioKind kind = 4;
  string title = 5;
  // regression: protege comportamiento existente — debe PASAR también en
  // base_commit. No cuenta para el requisito de rojo del criterio.
  bool regression = 6;
  repeated VerificationStep steps = 7;
  string author = 8;
  int32 position = 9;
  google.protobuf.Timestamp created_at = 10;
}

message TaskVerification {
  VerificationState state = 1;
  string spec_hash = 2;
  string base_commit = 3;
  string implementer = 4;
  google.protobuf.Timestamp frozen_at = 5;
  string verified_commit = 6;
  google.protobuf.Timestamp verified_at = 7;
}

message VerificationScenarioInput {
  string criterion_id = 1;
  ScenarioKind kind = 2;
  string title = 3;
  bool regression = 4;
  repeated VerificationStep steps = 5;
}

message ProposeScenariosRequest {
  string task_id = 1;
  string author = 2; // identidad del agente verificador
  repeated VerificationScenarioInput scenarios = 3; // spec completa (reemplaza la anterior)
  bool dry_run = 4; // solo valida, no persiste
}
message ProposeScenariosResponse {
  Task task = 1;
  string spec_hash = 2;
}

message FreezeSpecRequest {
  string task_id = 1;
  string base_commit = 2; // commit SIN el cambio contra el que se exige rojo
  string implementer = 3; // debe diferir de todos los authors
}
message FreezeSpecResponse { Task task = 1; }

message UnfreezeSpecRequest {
  string task_id = 1;
  string actor = 2;
  string reason = 3; // obligatorio: queda en el historial
}
message UnfreezeSpecResponse { Task task = 1; }

message StepEvidence {
  string scenario_id = 1;
  VerificationPhase phase = 2;
  int32 step_index = 3; // 0-based
  int32 exit_code = 4;
  string output = 5; // stdout+stderr, máx 256 KiB
  bool output_truncated = 6;
  int64 duration_ms = 7;
}

message StepResult {
  string scenario_id = 1;
  VerificationPhase phase = 2;
  int32 step_index = 3;
  int32 exit_code = 4;
  bool passed = 5; // calculado por el server
  string detail = 6;
  string output_sha256 = 7;
  int64 duration_ms = 8;
}

message VerificationRun {
  string id = 1;
  string task_id = 2;
  string event = 3; // run | unfreeze
  string spec_hash = 4;
  string base_commit = 5;
  string head_commit = 6;
  string actor = 7;
  bool passed = 8;
  repeated string reasons = 9;
  repeated StepResult results = 10;
  google.protobuf.Timestamp created_at = 11;
}

message RecordVerificationRequest {
  string task_id = 1;
  string spec_hash = 2;
  string base_commit = 3;
  string head_commit = 4; // sha de HEAD, con sufijo +dirty.<sha> si hay cambios sin commitear
  string runner = 5;
  repeated StepEvidence evidence = 6;
}
// Una corrida rechazada NO es un error gRPC: queda registrada con
// passed=false y reasons, y la Task pasa a VERIFICATION_FAILED.
message RecordVerificationResponse {
  VerificationRun run = 1;
  Task task = 2;
}

message ListVerificationRunsRequest {
  string task_id = 1;
  int32 limit = 2; // 0 = todas
}
message ListVerificationRunsResponse { repeated VerificationRun runs = 1; }

// ActivityGate: qué impide cerrar una activity. Pensado para hooks/CI.
message GetActivityGateRequest { string activity_id = 1; }
message GetActivityGateResponse {
  bool ready = 1;
  repeated string blocking = 2; // una línea por Task bloqueante
}

// ── Servicios ────────────────────────────────────────────────────────────

service BoardService {
  rpc CreateBoard(CreateBoardRequest) returns (CreateBoardResponse);
  rpc GetBoard(GetBoardRequest) returns (GetBoardResponse);
  rpc ListBoards(ListBoardsRequest) returns (ListBoardsResponse);
  rpc DeleteBoard(DeleteBoardRequest) returns (google.protobuf.Empty);
  rpc ResolveBoard(ResolveBoardRequest) returns (ResolveBoardResponse);
}

service ColumnService {
  rpc CreateColumn(CreateColumnRequest) returns (CreateColumnResponse);
  rpc ListColumns(ListColumnsRequest) returns (ListColumnsResponse);
  rpc DeleteColumn(DeleteColumnRequest) returns (google.protobuf.Empty);
  rpc ReorderColumns(ReorderColumnsRequest) returns (ReorderColumnsResponse);
}

service ActivityService {
  rpc CreateActivity(CreateActivityRequest) returns (CreateActivityResponse);
  rpc GetActivity(GetActivityRequest) returns (GetActivityResponse);
  rpc ListActivities(ListActivitiesRequest) returns (ListActivitiesResponse);
  rpc UpdateActivity(UpdateActivityRequest) returns (UpdateActivityResponse);
  rpc DeleteActivity(DeleteActivityRequest) returns (google.protobuf.Empty);
  rpc MoveActivity(MoveActivityRequest) returns (MoveActivityResponse);
}

service TaskService {
  rpc CreateTask(CreateTaskRequest) returns (CreateTaskResponse);
  rpc GetTask(GetTaskRequest) returns (GetTaskResponse);
  rpc ListTasks(ListTasksRequest) returns (ListTasksResponse);
  rpc UpdateTask(UpdateTaskRequest) returns (UpdateTaskResponse);
  rpc DeleteTask(DeleteTaskRequest) returns (google.protobuf.Empty);
}

service VerificationService {
  rpc ProposeScenarios(ProposeScenariosRequest) returns (ProposeScenariosResponse);
  rpc FreezeSpec(FreezeSpecRequest) returns (FreezeSpecResponse);
  rpc UnfreezeSpec(UnfreezeSpecRequest) returns (UnfreezeSpecResponse);
  rpc RecordVerification(RecordVerificationRequest) returns (RecordVerificationResponse);
  rpc ListVerificationRuns(ListVerificationRunsRequest) returns (ListVerificationRunsResponse);
  rpc GetActivityGate(GetActivityGateRequest) returns (GetActivityGateResponse);
}
