syntax = "proto3";

package profile.v1;

option go_package = "github.com/aomerge/higpertext-server-profile/gen/profile/v1;profilev1";

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";

// ── Gobernanza ──────────────────────────────────────────────────────────────

enum Severity {
  SEVERITY_UNSPECIFIED = 0;
  LOW = 1;      // override bidireccional con justificación
  MEDIUM = 2;   // solo puede endurecerse
  HIGH = 3;     // solo puede endurecerse
  CRITICAL = 4; // inmutable — no admite override
}

enum Scope {
  SCOPE_UNSPECIFIED = 0;
  COMMIT = 1;
  PR = 2;
  DEPLOY = 3;
  ANY = 4; // aplica en todos los scopes
}

// ── Perfiles ────────────────────────────────────────────────────────────────

message Profile {
  string id = 1;
  string name = 2; // slug único, ej. "agent_designer"
  string description = 3;
  string system_prompt = 4;
  repeated string capabilities = 5;  // ids de Capability (referencia blanda, sin FK)
  repeated string subprofiles = 6;   // nombres de otros Profile
  repeated string rules = 7;         // reglas de comportamiento en texto libre
  repeated string hooks_global = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
}

// ── Capabilities ────────────────────────────────────────────────────────────

message Parameter {
  string name = 1;
  string type = 2;
  bool required = 3;
  string description = 4;
  string default = 5; // valor por defecto declarado en el JSON de higpertext-cli (formato CLI, siempre string)
}

message Contract {
  repeated string rules = 1;
  string success_pattern = 2;
  string on_empty = 3; // mensaje/acción sugerida cuando la capability no encuentra resultados
}

message Capability {
  string id = 1; // natural key, ej. "common.session-start"
  string version = 2;
  string name = 3;
  string description = 4;
  string entrypoint = 5;
  string language = 6;
  repeated Parameter parameters = 7;
  bool requires_pat = 8;
  string hook_task_id = 9;
  Contract contract = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;
}

// ── Skills ─────────────────────────────────────────────────────────────────

// Skill almacena un documento SKILL.md completo. Content incluye el front
// matter YAML para preservar metadatos específicos de cada asistente.
message Skill {
  string id = 1; // clave natural estable, ej. "build"
  string name = 2;
  string description = 3;
  string content = 4;
  string version = 5;
  bool enabled = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

// ── Hooks ────────────────────────────────────────────────────────────────────

// HookDefinition espeja hooks_catalog.json + las capas de override en
// config/hooks/{global,profiles/<perfil>,custom}/*.json de higpertext-cli:
// un hook dispara un script nativo del asistente (Claude Code, etc.) en un
// evento concreto (PreToolUse, PostToolUse, UserPromptSubmit, Stop,
// PreCompact), opcionalmente acotado a un matcher de tool y a una lista de
// perfiles/asistentes. capability_id es una referencia blanda opcional
// (documental: la mayoría de los hooks — guardrails, telemetría, gestión de
// sesión — no ejecutan ninguna capability).
message HookDefinition {
  string id = 1;
  string event = 2;               // PreToolUse | PostToolUse | UserPromptSubmit | Stop | PreCompact
  string matcher = 3;              // "Bash", "Write|Edit", "" = todos los tools
  string script = 4;               // ruta del script fuente en el checkout de origen (referencia, no de runtime)
  string description = 5;
  int32 timeout = 6;               // segundos
  bool enabled = 7;
  repeated string assistants = 8;  // vacío = todos los asistentes
  repeated string profiles = 9;    // vacío = todos los perfiles (equivalente a la capa "global")
  string capability_id = 10;       // referencia blanda opcional a Capability.id
  int32 priority = 11;             // desempate entre capas al mergear por id; mayor pisa a menor
  string source_code = 12;         // contenido del script fuente, base64 (mismo patrón que Capability.SourceCode)
  google.protobuf.Timestamp created_at = 13;
  google.protobuf.Timestamp updated_at = 14;
}

// ── Reglas de gobernanza ──────────────────────────────────────────────────────

message GovernanceRule {
  string id = 1;
  string description = 2;
  Severity severity = 3;
  repeated Scope scopes = 4;
  bool automated = 5;
  string capability = 6;             // referencia blanda a Capability.id, opcional
  string source = 7;                 // "global" | nombre de perfil
  optional double numeric_threshold = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
  // Regex opcional: si está seteado, la regla también aplica en runtime como
  // intercepción de comando (hook_bash_guard.check_profile_rules la evalúa
  // contra el comando Bash, además de contar como gobernanza CI/PR/deploy).
  // Vacío = regla de gobernanza pura, sin efecto en hooks.
  string pattern = 11;
}

message GovernanceException {
  string id = 1;
  string rule_id = 2;
  string reason = 3;
  string approver = 4;
  string profile = 5;
  optional string expires = 6; // fecha ISO-8601 (YYYY-MM-DD), ausente = sin expiración
  google.protobuf.Timestamp created_at = 7;
}

// ── Actividad (registro de ejecuciones) ───────────────────────────────────────

message Activity {
  string id = 1;
  string capability_id = 2;
  string profile = 3;         // vacío = sin perfil activo al momento del registro
  string status = 4;          // "success" | "failure"
  string summary = 5;
  repeated string tags = 6;
  google.protobuf.Timestamp created_at = 7;
}

// ── Aprendizaje en vivo (Redis) ─────────────────────────────────────────────

message LearningEvent {
  string id = 1;
  string capability_id = 2;
  string profile = 3;
  string outcome = 4; // success | failure
  string summary = 5;
  repeated string tags = 6;
  google.protobuf.Timestamp created_at = 7;
}

message LearningStat {
  string capability_id = 1;
  int64 successes = 2;
  int64 failures = 3;
  int64 total = 4;
  double success_rate = 5; // successes / total; 0 when total == 0
  google.protobuf.Timestamp updated_at = 6;
}

// ── Requests / Responses ─────────────────────────────────────────────────────

message CreateProfileRequest {
  string name = 1;
  string description = 2;
  string system_prompt = 3;
  repeated string capabilities = 4;
  repeated string subprofiles = 5;
  repeated string rules = 6;
  repeated string hooks_global = 7;
}
message CreateProfileResponse { Profile profile = 1; }
message GetProfileRequest { string id = 1; }
message GetProfileResponse { Profile profile = 1; }
message ListProfilesRequest {}
message ListProfilesResponse { repeated Profile profiles = 1; }
message UpdateProfileRequest {
  string id = 1;
  string name = 2;
  string description = 3;
  string system_prompt = 4;
  repeated string capabilities = 5;
  repeated string subprofiles = 6;
  repeated string rules = 7;
  repeated string hooks_global = 8;
}
message UpdateProfileResponse { Profile profile = 1; }
message DeleteProfileRequest { string id = 1; }

message CreateCapabilityRequest {
  string id = 1;
  string version = 2;
  string name = 3;
  string description = 4;
  string entrypoint = 5;
  string language = 6;
  repeated Parameter parameters = 7;
  bool requires_pat = 8;
  string hook_task_id = 9;
  Contract contract = 10;
  string source_code = 11;             // contenido del script fuente, base64 (opcional en el RPC, obligatorio para poder ejecutarla)
  map<string, string> extra_files = 12; // filename -> contenido base64, helpers hermanos importados por el entrypoint
}
message CreateCapabilityResponse { Capability capability = 1; }
message GetCapabilityRequest { string id = 1; }
message GetCapabilityResponse { Capability capability = 1; }
message ListCapabilitiesRequest {}
message ListCapabilitiesResponse { repeated Capability capabilities = 1; }
message DeleteCapabilityRequest { string id = 1; }

message GetCapabilityScriptRequest { string id = 1; }
message GetCapabilityScriptResponse {
  string source_code = 1; // contenido del script fuente, base64
  string language = 2;
  map<string, string> extra_files = 3; // filename -> contenido base64, helpers hermanos importados por el entrypoint (ej. "_report_paths.py")
}

message CreateSkillRequest {
  string id = 1;
  string name = 2;
  string description = 3;
  string content = 4;
  string version = 5;
  bool enabled = 6;
}
message CreateSkillResponse { Skill skill = 1; }
message GetSkillRequest { string id = 1; }
message GetSkillResponse { Skill skill = 1; }
message ListSkillsRequest { bool enabled_only = 1; }
message ListSkillsResponse { repeated Skill skills = 1; }
message UpdateSkillRequest {
  string id = 1;
  string name = 2;
  string description = 3;
  string content = 4;
  string version = 5;
  bool enabled = 6;
}
message UpdateSkillResponse { Skill skill = 1; }
message DeleteSkillRequest { string id = 1; }

message CreateHookRequest {
  string id = 1;
  string event = 2;
  string matcher = 3;
  string script = 4;
  string description = 5;
  int32 timeout = 6;
  bool enabled = 7;
  repeated string assistants = 8;
  repeated string profiles = 9;
  string capability_id = 10;
  int32 priority = 11;
  string source_code = 12;
}
message CreateHookResponse { HookDefinition hook = 1; }
message GetHookRequest { string id = 1; }
message GetHookResponse { HookDefinition hook = 1; }
message ListHooksRequest {
  string profile = 1;    // vacío = todos los perfiles (incluye siempre los hooks "global", profiles=[])
  string assistant = 2;  // vacío = todos los asistentes
}
message ListHooksResponse { repeated HookDefinition hooks = 1; }
message DeleteHookRequest { string id = 1; }

message GetHookScriptRequest { string id = 1; }
message GetHookScriptResponse {
  string source_code = 1; // base64
}

// SharedHookAssets son las dependencias compartidas por *todos* los hooks de
// Claude Code — hook_utils.py, hook_io.py, _rules/*.py en higpertext-cli —
// que HookRenderer._deploy_hook_utils copia siempre a .claude/hooks/, sin
// importar qué hooks estén activos. No son parte de ningún HookDefinition
// individual: es un solo bundle, reemplazado entero en cada set.
message SharedHookAssets {
  map<string, string> files = 1; // ruta relativa (ej. "hook_utils.py", "_rules/bash_rules.py") -> base64
  google.protobuf.Timestamp updated_at = 2;
}
message SetSharedHookAssetsRequest { map<string, string> files = 1; }
message SetSharedHookAssetsResponse { SharedHookAssets assets = 1; }
message GetSharedHookAssetsRequest {}
message GetSharedHookAssetsResponse { SharedHookAssets assets = 1; }

message CreateRuleRequest {
  string id = 1; // natural key definido por el llamante, ej. "sec-001"
  string description = 2;
  Severity severity = 3;
  repeated Scope scopes = 4;
  bool automated = 5;
  string capability = 6;
  string source = 7;
  optional double numeric_threshold = 8;
  string pattern = 9; // ver GovernanceRule.pattern
}
message CreateRuleResponse { GovernanceRule rule = 1; }
message ListRulesRequest {
  // scope sin especificar = todas las reglas, sin filtrar.
  Scope scope = 1;
}
message ListRulesResponse { repeated GovernanceRule rules = 1; }
message DeleteRuleRequest { string id = 1; }

message CreateExceptionRequest {
  string rule_id = 1;
  string reason = 2;
  string approver = 3;
  string profile = 4;
  optional string expires = 5;
}
message CreateExceptionResponse { GovernanceException exception = 1; }
message ListExceptionsRequest {
  string profile = 1;  // vacío = todas
  bool active_only = 2; // true = excluye expiradas
}
message ListExceptionsResponse { repeated GovernanceException exceptions = 1; }
message DeleteExceptionRequest { string id = 1; }

message RecordActivityRequest {
  string capability_id = 1;
  string profile = 2;
  string status = 3;
  string summary = 4;
  repeated string tags = 5;
}
message RecordActivityResponse { Activity activity = 1; }
message ListActivitiesRequest {
  string profile = 1; // vacío = todas
  int32 limit = 2;    // <=0 = sin límite explícito (el server aplica un tope razonable)
}
message ListActivitiesResponse { repeated Activity activities = 1; }

message RecordLearningRequest {
  string capability_id = 1;
  string profile = 2;
  string outcome = 3; // success | failure
  string summary = 4;
  repeated string tags = 5;
}
message RecordLearningResponse { LearningEvent event = 1; }
message ListLearningEventsRequest {
  string profile = 1; // vacío = todos
  int32 limit = 2;    // <=0 = 200; máximo 1000
}
message ListLearningEventsResponse { repeated LearningEvent events = 1; }
message GetLearningStatsRequest {}
message GetLearningStatsResponse { repeated LearningStat stats = 1; }

// ── Servicios ─────────────────────────────────────────────────────────────────

service ProfileService {
  rpc CreateProfile(CreateProfileRequest) returns (CreateProfileResponse);
  rpc GetProfile(GetProfileRequest) returns (GetProfileResponse);
  rpc ListProfiles(ListProfilesRequest) returns (ListProfilesResponse);
  rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileResponse);
  rpc DeleteProfile(DeleteProfileRequest) returns (google.protobuf.Empty);
}

service CapabilityService {
  rpc CreateCapability(CreateCapabilityRequest) returns (CreateCapabilityResponse);
  rpc GetCapability(GetCapabilityRequest) returns (GetCapabilityResponse);
  rpc ListCapabilities(ListCapabilitiesRequest) returns (ListCapabilitiesResponse);
  rpc DeleteCapability(DeleteCapabilityRequest) returns (google.protobuf.Empty);
  rpc GetCapabilityScript(GetCapabilityScriptRequest) returns (GetCapabilityScriptResponse);
}

service SkillService {
  rpc CreateSkill(CreateSkillRequest) returns (CreateSkillResponse);
  rpc GetSkill(GetSkillRequest) returns (GetSkillResponse);
  rpc ListSkills(ListSkillsRequest) returns (ListSkillsResponse);
  rpc UpdateSkill(UpdateSkillRequest) returns (UpdateSkillResponse);
  rpc DeleteSkill(DeleteSkillRequest) returns (google.protobuf.Empty);
}

service HookService {
  rpc CreateHook(CreateHookRequest) returns (CreateHookResponse);
  rpc GetHook(GetHookRequest) returns (GetHookResponse);
  rpc ListHooks(ListHooksRequest) returns (ListHooksResponse);
  rpc DeleteHook(DeleteHookRequest) returns (google.protobuf.Empty);
  rpc GetHookScript(GetHookScriptRequest) returns (GetHookScriptResponse);

  rpc SetSharedHookAssets(SetSharedHookAssetsRequest) returns (SetSharedHookAssetsResponse);
  rpc GetSharedHookAssets(GetSharedHookAssetsRequest) returns (GetSharedHookAssetsResponse);
}

service GovernanceService {
  rpc CreateRule(CreateRuleRequest) returns (CreateRuleResponse);
  rpc ListRules(ListRulesRequest) returns (ListRulesResponse);
  rpc DeleteRule(DeleteRuleRequest) returns (google.protobuf.Empty);

  rpc CreateException(CreateExceptionRequest) returns (CreateExceptionResponse);
  rpc ListExceptions(ListExceptionsRequest) returns (ListExceptionsResponse);
  rpc DeleteException(DeleteExceptionRequest) returns (google.protobuf.Empty);
}

service ActivityService {
  rpc RecordActivity(RecordActivityRequest) returns (RecordActivityResponse);
  rpc ListActivities(ListActivitiesRequest) returns (ListActivitiesResponse);
}

service LearningService {
  rpc RecordLearning(RecordLearningRequest) returns (RecordLearningResponse);
  rpc ListLearningEvents(ListLearningEventsRequest) returns (ListLearningEventsResponse);
  rpc GetLearningStats(GetLearningStatsRequest) returns (GetLearningStatsResponse);
}
