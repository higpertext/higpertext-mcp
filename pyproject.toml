[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "higpertext-mcp"
version = "0.1.0"
description = "Servidor MCP que expone capabilities y hooks nativos como tools/scripts reales."
requires-python = ">=3.10"
license = {text = "Proprietary"}
dependencies = [
    # Pineado a la serie 1.x: verificado contra 1.29.1. mcp 2.x reestructuró
    # server.fastmcp/server.lowlevel de forma incompatible (probado en este repo).
    "mcp>=1.12.0,<2.0.0",
    # Memoria (higpertext:memory:*): reemplaza los archivos estáticos .memory/*.
    "redis>=5.0,<6.0",
    # Cliente al profile server (gRPC): catálogo dinámico de capabilities + registro
    # de actividad. grpcio-tools solo se usa para regenerar gen/profile/v1/*_pb2*.py
    # (ver Makefile/generate), no hace falta en runtime.
    "grpcio>=1.66",
    # Los stubs gRPC versionados en gen/ importan google.protobuf directamente.
    "protobuf>=7.35.1,<8.0",
    # Transporte HTTP para clientes que no pueden lanzar un MCP stdio desde
    # fuera de su sandbox (por ejemplo Postman Flatpak).
    "starlette>=0.37,<1.0",
    "uvicorn>=0.30,<1.0",
    # security.secret-set: guarda API keys en el keyring nativo del SO
    # (Keychain/Secret Service/Credential Manager). Opcional en runtime — si
    # el backend del SO no está disponible, get/status degradan; set/delete
    # fallan explícito (ver capability security.secret-set).
    "keyring>=25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "grpcio-tools>=1.66",
]

[project.scripts]
higpertext-mcp = "higpertext_mcp.server:run"
higpertext-hook = "higpertext_mcp.hook_invoker:main"

[tool.setuptools.packages.find]
where = ["src"]
